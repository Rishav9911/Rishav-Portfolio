<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <title>PDF Xtractify — layout-aware document outline extraction UI mockup</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b13"/>
      <stop offset="100%" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C8DFF"/>
      <stop offset="100%" stop-color="#7B6CFF"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ebebf0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>

  <circle cx="180" cy="200" r="320" fill="#4C8DFF" opacity="0.28" filter="url(#blob)"/>
  <circle cx="1040" cy="1020" r="300" fill="#7B6CFF" opacity="0.24" filter="url(#blob)"/>

  <g filter="url(#softShadow)">
    <rect x="150" y="260" width="900" height="680" rx="28" fill="#ebebf0" fill-opacity="0.045" stroke="#ebebf0" stroke-opacity="0.12"/>
    <rect x="151" y="261" width="898" height="2" rx="1" fill="url(#cardTop)"/>
  </g>

  <circle cx="196" cy="300" r="6" fill="#FF6F6F" opacity="0.85"/>
  <circle cx="218" cy="300" r="6" fill="#FFC96F" opacity="0.85"/>
  <circle cx="240" cy="300" r="6" fill="#6FE0A0" opacity="0.85"/>
  <text x="266" y="305" font-family="'JetBrains Mono', monospace" font-size="15" letter-spacing="0.5" fill="#ebebf0" fill-opacity="0.5">pdf-xtractify — layout engine</text>

  <rect x="190" y="340" width="480" height="460" rx="16" fill="#eceef4" fill-opacity="0.95"/>
  <circle cx="222" cy="374" r="12" fill="url(#accent)"/>
  <text x="246" y="379" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="16" fill="#1b1c26">Report.pdf</text>
  <text x="606" y="379" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b8d9a" text-anchor="end">112 pages</text>

  <rect x="222" y="412" width="70" height="10" rx="5" fill="url(#accent)" opacity="0.9"/>
  <rect x="222" y="432" width="410" height="24" rx="6" fill="none" stroke="#4C8DFF" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="232" y="448" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#28304a">1. Executive Summary</text>

  <rect x="222" y="472" width="392" height="8" rx="4" fill="#d4d6e0"/>
  <rect x="222" y="490" width="360" height="8" rx="4" fill="#d4d6e0"/>
  <rect x="222" y="508" width="378" height="8" rx="4" fill="#d4d6e0"/>

  <rect x="222" y="540" width="70" height="10" rx="5" fill="url(#accent)" opacity="0.6"/>
  <rect x="248" y="562" width="366" height="22" rx="6" fill="none" stroke="#7B6CFF" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="258" y="577" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#3a3350">1.1 Methodology</text>

  <rect x="248" y="598" width="344" height="8" rx="4" fill="#d4d6e0"/>
  <rect x="248" y="616" width="320" height="8" rx="4" fill="#d4d6e0"/>

  <rect x="222" y="650" width="70" height="10" rx="5" fill="url(#accent)" opacity="0.9"/>
  <rect x="222" y="672" width="410" height="24" rx="6" fill="none" stroke="#4C8DFF" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="232" y="688" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#28304a">2. Key Findings</text>

  <rect x="222" y="712" width="392" height="8" rx="4" fill="#d4d6e0"/>
  <rect x="222" y="730" width="404" height="8" rx="4" fill="#d4d6e0"/>
  <rect x="222" y="748" width="340" height="8" rx="4" fill="#d4d6e0"/>
  <rect x="222" y="766" width="380" height="8" rx="4" fill="#d4d6e0"/>

  <rect x="690" y="340" width="320" height="460" rx="16" fill="#ebebf0" fill-opacity="0.06" stroke="#ebebf0" stroke-opacity="0.12"/>
  <text x="716" y="378" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="1.5" fill="#8fb8ff" opacity="0.85">EXTRACTED OUTLINE</text>

  <line x1="726" y1="404" x2="726" y2="742" stroke="#ebebf0" stroke-opacity="0.14" stroke-width="1.5"/>

  <circle cx="726" cy="410" r="5" fill="#4C8DFF"/>
  <rect x="744" y="402" width="230" height="16" rx="6" fill="#ebebf0" fill-opacity="0.9"/>
  <text x="752" y="414" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#1b1c26">Executive Summary</text>

  <circle cx="726" cy="452" r="4" fill="#7B6CFF"/>
  <rect x="756" y="445" width="190" height="13" rx="5" fill="#ebebf0" fill-opacity="0.45"/>

  <circle cx="726" cy="490" r="4" fill="#7B6CFF"/>
  <rect x="756" y="483" width="150" height="13" rx="5" fill="#ebebf0" fill-opacity="0.45"/>

  <circle cx="726" cy="530" r="5" fill="#4C8DFF"/>
  <rect x="744" y="522" width="230" height="16" rx="6" fill="#ebebf0" fill-opacity="0.9"/>
  <text x="752" y="534" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#1b1c26">Key Findings</text>

  <circle cx="726" cy="572" r="4" fill="#7B6CFF"/>
  <rect x="756" y="565" width="200" height="13" rx="5" fill="#ebebf0" fill-opacity="0.45"/>

  <circle cx="726" cy="610" r="5" fill="#4C8DFF"/>
  <rect x="744" y="602" width="230" height="16" rx="6" fill="#ebebf0" fill-opacity="0.9"/>
  <text x="752" y="614" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#1b1c26">Recommendations</text>

  <circle cx="726" cy="652" r="4" fill="#7B6CFF"/>
  <rect x="756" y="645" width="170" height="13" rx="5" fill="#ebebf0" fill-opacity="0.45"/>

  <circle cx="726" cy="690" r="5" fill="#4C8DFF"/>
  <rect x="744" y="682" width="230" height="16" rx="6" fill="#ebebf0" fill-opacity="0.9"/>
  <text x="752" y="694" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#1b1c26">Appendix</text>

  <rect x="190" y="838" width="256" height="62" rx="14" fill="#ebebf0" fill-opacity="0.06" stroke="#4C8DFF" stroke-opacity="0.3"/>
  <text x="318" y="866" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#8fb8ff" text-anchor="middle">95%+</text>
  <text x="318" y="884" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">HEADING ACCURACY</text>

  <rect x="472" y="838" width="256" height="62" rx="14" fill="#ebebf0" fill-opacity="0.06" stroke="#7B6CFF" stroke-opacity="0.3"/>
  <text x="600" y="866" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#c3a3ff" text-anchor="middle">100+</text>
  <text x="600" y="884" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">PAGES HANDLED</text>

  <rect x="754" y="838" width="256" height="62" rx="14" fill="#ebebf0" fill-opacity="0.06" stroke="#4C8DFF" stroke-opacity="0.3"/>
  <text x="882" y="866" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#8fb8ff" text-anchor="middle">CPU-only</text>
  <text x="882" y="884" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">0.22 PAGES/SEC</text>
</svg>
