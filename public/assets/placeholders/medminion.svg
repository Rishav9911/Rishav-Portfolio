<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <title>MedMinion — clinic symptom-triage dashboard UI mockup</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080e0f"/>
      <stop offset="100%" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DD4E8"/>
      <stop offset="100%" stop-color="#5CE0B8"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ebebf0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>

  <circle cx="1040" cy="220" r="320" fill="#4DD4E8" opacity="0.26" filter="url(#blob)"/>
  <circle cx="180" cy="1020" r="300" fill="#5CE0B8" opacity="0.24" filter="url(#blob)"/>

  <g filter="url(#softShadow)">
    <rect x="150" y="260" width="900" height="680" rx="28" fill="#ebebf0" fill-opacity="0.045" stroke="#ebebf0" stroke-opacity="0.12"/>
    <rect x="151" y="261" width="898" height="2" rx="1" fill="url(#cardTop)"/>
  </g>

  <circle cx="196" cy="300" r="6" fill="#FF6F6F" opacity="0.85"/>
  <circle cx="218" cy="300" r="6" fill="#FFC96F" opacity="0.85"/>
  <circle cx="240" cy="300" r="6" fill="#6FE0A0" opacity="0.85"/>
  <text x="266" y="305" font-family="'JetBrains Mono', monospace" font-size="15" letter-spacing="0.5" fill="#ebebf0" fill-opacity="0.5">medminion — clinic dashboard</text>

  <rect x="190" y="340" width="440" height="150" rx="16" fill="#ebebf0" fill-opacity="0.06" stroke="#ebebf0" stroke-opacity="0.1"/>
  <circle cx="230" cy="382" r="20" fill="url(#accent)" opacity="0.85"/>
  <text x="230" y="388" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#08080e" text-anchor="middle">NR</text>
  <text x="262" y="380" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="15" fill="#ebebf0">Nisha Rao</text>
  <text x="262" y="398" font-family="'Inter', sans-serif" font-size="12" fill="#ebebf0" fill-opacity="0.5">Age 34 · Walk-in · 10:40 AM</text>

  <text x="230" y="430" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1" fill="#8aeed0" opacity="0.85">REPORTED SYMPTOMS</text>
  <rect x="230" y="440" width="70" height="24" rx="12" fill="#5CE0B8" fill-opacity="0.16" stroke="#5CE0B8" stroke-opacity="0.4"/>
  <text x="265" y="456" font-family="'Inter', sans-serif" font-size="11" fill="#8aeed0" text-anchor="middle">Fever</text>
  <rect x="308" y="440" width="76" height="24" rx="12" fill="#5CE0B8" fill-opacity="0.16" stroke="#5CE0B8" stroke-opacity="0.4"/>
  <text x="346" y="456" font-family="'Inter', sans-serif" font-size="11" fill="#8aeed0" text-anchor="middle">Cough</text>
  <rect x="392" y="440" width="86" height="24" rx="12" fill="#5CE0B8" fill-opacity="0.16" stroke="#5CE0B8" stroke-opacity="0.4"/>
  <text x="435" y="456" font-family="'Inter', sans-serif" font-size="11" fill="#8aeed0" text-anchor="middle">Fatigue</text>
  <rect x="486" y="440" width="102" height="24" rx="12" fill="#ebebf0" fill-opacity="0.08"/>
  <text x="537" y="456" font-family="'Inter', sans-serif" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">+ add symptom</text>

  <rect x="190" y="512" width="440" height="288" rx="16" fill="#ebebf0" fill-opacity="0.06" stroke="#ebebf0" stroke-opacity="0.1"/>
  <text x="216" y="548" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1" fill="#8aeed0" opacity="0.85">LIKELY DIAGNOSES</text>

  <text x="216" y="586" font-family="'Inter', sans-serif" font-size="13" fill="#ebebf0">Viral pharyngitis</text>
  <text x="604" y="586" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8aeed0" text-anchor="end">82%</text>
  <rect x="216" y="596" width="388" height="8" rx="4" fill="#ebebf0" fill-opacity="0.1"/>
  <rect x="216" y="596" width="318" height="8" rx="4" fill="url(#accent)"/>

  <text x="216" y="634" font-family="'Inter', sans-serif" font-size="13" fill="#ebebf0">Seasonal influenza</text>
  <text x="604" y="634" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8aeed0" text-anchor="end">61%</text>
  <rect x="216" y="644" width="388" height="8" rx="4" fill="#ebebf0" fill-opacity="0.1"/>
  <rect x="216" y="644" width="237" height="8" rx="4" fill="url(#accent)" opacity="0.8"/>

  <text x="216" y="682" font-family="'Inter', sans-serif" font-size="13" fill="#ebebf0">Common cold</text>
  <text x="604" y="682" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8aeed0" text-anchor="end">44%</text>
  <rect x="216" y="692" width="388" height="8" rx="4" fill="#ebebf0" fill-opacity="0.1"/>
  <rect x="216" y="692" width="171" height="8" rx="4" fill="url(#accent)" opacity="0.6"/>

  <rect x="216" y="730" width="388" height="46" rx="10" fill="#5CE0B8" fill-opacity="0.1" stroke="#5CE0B8" stroke-opacity="0.35"/>
  <text x="232" y="758" font-family="'Inter', sans-serif" font-size="12" fill="#8aeed0">Suggested: rest, fluids, follow-up in 3 days</text>

  <rect x="654" y="340" width="356" height="460" rx="16" fill="#ebebf0" fill-opacity="0.06" stroke="#ebebf0" stroke-opacity="0.1"/>
  <text x="680" y="376" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1" fill="#8aeed0" opacity="0.85">TODAY'S SCHEDULE</text>

  <rect x="680" y="394" width="304" height="58" rx="12" fill="#ebebf0" fill-opacity="0.08" stroke="#5CE0B8" stroke-opacity="0.4"/>
  <rect x="680" y="394" width="4" height="58" rx="2" fill="url(#accent)"/>
  <text x="700" y="416" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#ebebf0">10:40 · Nisha Rao</text>
  <text x="700" y="434" font-family="'Inter', sans-serif" font-size="11" fill="#ebebf0" fill-opacity="0.5">Fever, cough, fatigue</text>

  <rect x="680" y="464" width="304" height="58" rx="12" fill="#ebebf0" fill-opacity="0.05"/>
  <text x="700" y="486" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#ebebf0" fill-opacity="0.8">11:15 · Arjun Mehta</text>
  <text x="700" y="504" font-family="'Inter', sans-serif" font-size="11" fill="#ebebf0" fill-opacity="0.4">Follow-up, allergy check</text>

  <rect x="680" y="534" width="304" height="58" rx="12" fill="#ebebf0" fill-opacity="0.05"/>
  <text x="700" y="556" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#ebebf0" fill-opacity="0.8">11:50 · Priya Nair</text>
  <text x="700" y="574" font-family="'Inter', sans-serif" font-size="11" fill="#ebebf0" fill-opacity="0.4">New patient intake</text>

  <text x="680" y="632" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1" fill="#8aeed0" opacity="0.85">QUEUE</text>
  <circle cx="694" cy="662" r="22" fill="url(#accent)" opacity="0.9"/>
  <text x="694" y="668" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#08080e" text-anchor="middle">7</text>
  <text x="726" y="658" font-family="'Inter', sans-serif" font-size="12" fill="#ebebf0" fill-opacity="0.7">patients waiting</text>
  <text x="726" y="674" font-family="'Inter', sans-serif" font-size="11" fill="#ebebf0" fill-opacity="0.45">avg. wait 6 min</text>

  <rect x="190" y="838" width="426" height="62" rx="14" fill="#ebebf0" fill-opacity="0.06" stroke="#5CE0B8" stroke-opacity="0.3"/>
  <text x="403" y="866" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#8aeed0" text-anchor="middle">+26%</text>
  <text x="403" y="884" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">DIAGNOSIS ACCURACY</text>

  <rect x="632" y="838" width="378" height="62" rx="14" fill="#ebebf0" fill-opacity="0.06" stroke="#4DD4E8" stroke-opacity="0.3"/>
  <text x="821" y="866" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#8aeed0" text-anchor="middle">10+</text>
  <text x="821" y="884" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">TRIAL ACCOUNTS TESTED</text>
</svg>
