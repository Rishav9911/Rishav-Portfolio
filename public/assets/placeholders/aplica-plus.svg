  <text x="698" y="440" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1" fill="#ff9dc8" opacity="0.85">COVER LETTER PREVIEW</text>
  <rect x="698" y="456" width="288" height="8" rx="4" fill="#ebebf0" fill-opacity="0.16"/>
  <rect x="698" y="474" width="266" height="8" rx="4" fill="#ebebf0" fill-opacity="0.16"/>
  <rect x="698" y="492" width="280" height="8" rx="4" fill="#ebebf0" fill-opacity="0.16"/>
  <rect x="698" y="510" width="200" height="8" rx="4" fill="#ebebf0" fill-opacity="0.16"/>
  <rect x="698" y="510" width="4" height="10" fill="#FF6FB0"/>

  <rect x="698" y="546" width="288" height="1" fill="#ebebf0" fill-opacity="0.1"/>

  <text x="698" y="576" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1" fill="#c3a3ff" opacity="0.85">INTERVIEW PREP</text>
  <rect x="698" y="592" width="288" height="46" rx="10" fill="#ebebf0" fill-opacity="0.05" stroke="#ebebf0" stroke-opacity="0.1"/>
  <circle cx="716" cy="615" r="4" fill="#5CE0B8"/>
  <text x="730" y="619" font-family="'Inter', sans-serif" font-size="11" fill="#ebebf0" fill-opacity="0.7">Mock answer scored 8.4/10</text>

  <rect x="698" y="678" width="288" height="44" rx="22" fill="url(#accent)"/>
  <text x="842" y="705" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">Autofill application</text>

  <rect x="190" y="838" width="256" height="62" rx="14" fill="#ebebf0" fill-opacity="0.06" stroke="#A469FF" stroke-opacity="0.3"/>
  <text x="318" y="866" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#c3a3ff" text-anchor="middle">500/day</text>
  <text x="318" y="884" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">OUTREACH EMAILS</text>

  <rect x="472" y="838" width="256" height="62" rx="14" fill="#ebebf0" fill-opacity="0.06" stroke="#FF6FB0" stroke-opacity="0.3"/>
  <text x="600" y="866" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ff9dc8" text-anchor="middle">30+/wk</text>
  <text x="600" y="884" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">APPS AUTOMATED</text>

  <rect x="754" y="838" width="256" height="62" rx="14" fill="#ebebf0" fill-opacity="0.06" stroke="#A469FF" stroke-opacity="0.3"/>
  <text x="882" y="866" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#c3a3ff" text-anchor="middle">60%</text>
  <text x="882" y="884" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">LESS REVIEW TIME</text>
</svg>
