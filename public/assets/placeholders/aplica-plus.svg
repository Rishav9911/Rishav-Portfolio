<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <title>Aplica+ — AI job-matching browser extension UI mockup</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a13"/>
      <stop offset="100%" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A469FF"/>
      <stop offset="100%" stop-color="#FF6FB0"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="popShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ebebf0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>

  <circle cx="1040" cy="220" r="320" fill="#A469FF" opacity="0.28" filter="url(#blob)"/>
  <circle cx="180" cy="1020" r="300" fill="#FF6FB0" opacity="0.24" filter="url(#blob)"/>

  <g filter="url(#softShadow)">
    <rect x="150" y="260" width="900" height="680" rx="28" fill="#ebebf0" fill-opacity="0.045" stroke="#ebebf0" stroke-opacity="0.12"/>
    <rect x="151" y="261" width="898" height="2" rx="1" fill="url(#cardTop)"/>
  </g>

  <circle cx="196" cy="300" r="6" fill="#FF6F6F" opacity="0.85"/>
  <circle cx="218" cy="300" r="6" fill="#FFC96F" opacity="0.85"/>
  <circle cx="240" cy="300" r="6" fill="#6FE0A0" opacity="0.85"/>
  <rect x="266" y="290" width="500" height="24" rx="12" fill="#ebebf0" fill-opacity="0.06" stroke="#ebebf0" stroke-opacity="0.1"/>
  <text x="282" y="306" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ebebf0" fill-opacity="0.45">careers.acme.com/jobs/senior-engineer</text>

  <rect x="190" y="346" width="450" height="126" rx="16" fill="#ebebf0" fill-opacity="0.06" stroke="#ebebf0" stroke-opacity="0.1"/>
  <circle cx="228" cy="384" r="18" fill="url(#accent)" opacity="0.85"/>
  <text x="256" y="382" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="15" fill="#ebebf0">Senior Backend Engineer</text>
  <text x="256" y="402" font-family="'Inter', sans-serif" font-size="12" fill="#ebebf0" fill-opacity="0.5">Acme Robotics · Remote</text>
  <rect x="562" y="366" width="58" height="24" rx="12" fill="#FF6FB0" fill-opacity="0.16" stroke="#FF6FB0" stroke-opacity="0.4"/>
  <text x="591" y="382" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#ff9dc8" text-anchor="middle">94%</text>
  <rect x="228" y="422" width="120" height="20" rx="10" fill="#ebebf0" fill-opacity="0.08"/>
  <text x="288" y="436" font-family="'Inter', sans-serif" font-size="10" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">Python</text>
  <rect x="356" y="422" width="110" height="20" rx="10" fill="#ebebf0" fill-opacity="0.08"/>
  <text x="411" y="436" font-family="'Inter', sans-serif" font-size="10" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">Distributed</text>

  <rect x="190" y="488" width="450" height="126" rx="16" fill="#ebebf0" fill-opacity="0.06" stroke="#ebebf0" stroke-opacity="0.1"/>
  <circle cx="228" cy="526" r="18" fill="url(#accent)" opacity="0.6"/>
  <text x="256" y="524" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="15" fill="#ebebf0">ML Platform Intern</text>
  <text x="256" y="544" font-family="'Inter', sans-serif" font-size="12" fill="#ebebf0" fill-opacity="0.5">Northwind Labs · Hybrid</text>
  <rect x="562" y="508" width="58" height="24" rx="12" fill="#A469FF" fill-opacity="0.16" stroke="#A469FF" stroke-opacity="0.4"/>
  <text x="591" y="524" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#c3a3ff" text-anchor="middle">88%</text>
  <rect x="228" y="564" width="100" height="20" rx="10" fill="#ebebf0" fill-opacity="0.08"/>
  <text x="278" y="578" font-family="'Inter', sans-serif" font-size="10" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">PyTorch</text>
  <rect x="336" y="564" width="90" height="20" rx="10" fill="#ebebf0" fill-opacity="0.08"/>
  <text x="381" y="578" font-family="'Inter', sans-serif" font-size="10" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">MLOps</text>

  <rect x="190" y="630" width="450" height="126" rx="16" fill="#ebebf0" fill-opacity="0.06" stroke="#ebebf0" stroke-opacity="0.1"/>
  <circle cx="228" cy="668" r="18" fill="url(#accent)" opacity="0.4"/>
  <text x="256" y="666" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="15" fill="#ebebf0">Full-Stack Developer</text>
  <text x="256" y="686" font-family="'Inter', sans-serif" font-size="12" fill="#ebebf0" fill-opacity="0.5">Fenwick Health · Remote</text>
  <rect x="562" y="650" width="58" height="24" rx="12" fill="#FF6FB0" fill-opacity="0.16" stroke="#FF6FB0" stroke-opacity="0.4"/>
  <text x="591" y="666" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#ff9dc8" text-anchor="middle">81%</text>
  <rect x="228" y="706" width="90" height="20" rx="10" fill="#ebebf0" fill-opacity="0.08"/>
  <text x="273" y="720" font-family="'Inter', sans-serif" font-size="10" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">React</text>
  <rect x="326" y="706" width="100" height="20" rx="10" fill="#ebebf0" fill-opacity="0.08"/>
  <text x="376" y="720" font-family="'Inter', sans-serif" font-size="10" fill="#ebebf0" fill-opacity="0.55" text-anchor="middle">Node.js</text>

  <g filter="url(#popShadow)">
    <rect x="672" y="356" width="338" height="410" rx="18" fill="#141420" stroke="#ebebf0" stroke-opacity="0.14"/>
  </g>
  <rect x="672" y="356" width="338" height="56" rx="18" fill="url(#accent)" opacity="0.85"/>
  <rect x="672" y="392" width="338" height="20" fill="#141420" opacity="0.001"/>
